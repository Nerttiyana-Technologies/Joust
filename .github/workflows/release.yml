name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 1) Build the native shim for every shipped RID on a matching runner.
# 2) Assemble all binaries, pack the NuGet packages (with runtimes/<rid>/native) and push to NuGet.
jobs:
  build-native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native shim
        shell: bash
        run: ./build-native.sh ${{ matrix.rid }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/runtimes/${{ matrix.rid }}/native/*

  pack-and-publish:
    name: Pack & Publish
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-native

      - name: Assemble native runtimes
        shell: bash
        run: |
          mkdir -p native/runtimes
          for dir in artifacts-native/native-*/; do
            rid="$(basename "$dir" | sed 's/^native-//')"
            mkdir -p "native/runtimes/$rid/native"
            cp "$dir"* "native/runtimes/$rid/native/"
          done
          echo "Assembled:" && find native/runtimes -type f

      - name: Pack
        run: |
          dotnet pack src/Joust/Joust.csproj                 -c Release -o nupkgs
          dotnet pack src/Joust.VectorData/Joust.VectorData.csproj       -c Release -o nupkgs
          dotnet pack src/Joust.SemanticKernel/Joust.SemanticKernel.csproj -c Release -o nupkgs

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org (owner: Nerttiyana-Technologies,
      # repo: Joust, workflow file: release.yml) and a NUGET_USER secret = your nuget.org username.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
